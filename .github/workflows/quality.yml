name: Quality checks

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the manuscript
        run: python3 tools/check_book.py

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.2/mdbook-v0.5.2-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv mdbook /usr/local/bin/

      - name: Build the book
        run: mdbook build my-book

      - name: Check that the sample files regenerate
        run: |
          pip install python-docx pypandoc_binary
          python3 tools/build_samples.py
          git diff --stat -- my-book/src/samples || true
