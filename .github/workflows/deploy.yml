name: Build and Deploy Book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install mdBook
        run: |
          cargo install mdbook --locked

      # mdbook build triggers all backends defined in book.toml:
      #   output.html     → docs/html/
      #   output.markdown → docs/markdown/
      - name: Build book (HTML + Markdown)
        run: |
          cd my-book
          mdbook build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: my-book/docs/html

      - name: Upload Markdown output
        uses: actions/upload-artifact@v7
        with:
          name: markdown-output
          path: my-book/docs/markdown/
          if-no-files-found: warn

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
